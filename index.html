<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery Slider</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-top: 30px;
        }

        .slider {
            width: 70%;
            max-width: 700px;
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        .slider img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Image Gallery Slider</h1>

    <div class="slider">
        <img id="slide" 
        src="https://picsum.photos/id/1015/900/500">
    </div>

    <button onclick="prevImage()">❮ Previous</button>
    <button onclick="nextImage()">Next ❯</button>

    <script>
        let images = [
            "https://picsum.photos/id/1015/900/500",
            "https://picsum.photos/id/1016/900/500",
            "https://picsum.photos/id/1018/900/500",
            "https://picsum.photos/id/1020/900/500"
        ];

        let index = 0;

        function showImage() {
            document.getElementById("slide").src = images[index];
        }

        function nextImage() {
            index++;

            if (index >= images.length) {
                index = 0;
            }

            showImage();
        }

        function prevImage() {
            index--;

            if (index < 0) {
                index = images.length - 1;
            }

            showImage();
        }
    </script>

</body>
</html>
